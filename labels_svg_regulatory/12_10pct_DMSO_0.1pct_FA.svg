  <text x="166" y="96" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">HAZARD STATEMENTS:</text><text x="166" y="108" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">Not a hazardous mixture according to GHS / CLP (DMSO not</text><text x="166" y="119.2" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">classified; FA &lt; 2% SCL).</text><text x="166" y="130.4" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">Advisory: Contains 10% DMSO (facilitates skin absorption)</text><text x="166" y="141.6" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">and 0.1% Formic Acid.</text><text x="166" y="174" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e40af">PRECAUTIONARY STATEMENTS:</text><text x="166" y="186" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">P280: Wear standard laboratory gloves and eye protection.</text><text x="166" y="197.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">Wash skin after contact.</text>
