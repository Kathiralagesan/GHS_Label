-182c3-27 195-1324 198-1337 2-12 2-16 2-35 0-23 0-31-5-47a234 234 0 0 0-106-138 496 496 0 0 0-291-85h-30zm20 2011h-12a302 302 0 0 0-243 141 338 338 0 0 0-55 232 343 343 0 0 0 114 218 310 310 0 0 0 199 74 316 316 0 0 0 258-141 341 341 0 0 0 54-234 390 390 0 0 0-32-110 317 317 0 0 0-281-180"/></svg><text x="78" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#374151">GHS02 + GHS05 + GHS07</text>
  <text x="166" y="96" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">HAZARD STATEMENTS:</text><text x="166" y="108" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">H225: Highly flammable liquid and vapour.</text><text x="166" y="119.2" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">H302+H312+H332: Harmful if swallowed, in contact with</text><text x="166" y="130.4" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">skin, or if inhaled.</text><text x="166" y="141.6" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">H314: Causes severe skin burns and eye damage (1% TFA</text><text x="166" y="152.79999999999998" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">conservative EHS).</text><text x="166" y="174" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e40af">PRECAUTIONARY STATEMENTS:</text><text x="166" y="186" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">P210: Keep away from heat, sparks, open flames. No</text><text x="166" y="197.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">smoking.</text><text x="166" y="208.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">P260: Do not breathe vapours. P280: Wear gloves, lab coat,</text><text x="166" y="219.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">eye protection.</text><text x="166" y="230.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">P305+P351+P338: IF IN EYES: Rinse cautiously with water</text><text x="166" y="241.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">for several minutes.</text>
