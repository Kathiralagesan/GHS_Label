  <text x="166" y="96" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">HAZARD STATEMENTS:</text><text x="166" y="108" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">H225: Highly flammable liquid and vapour.</text><text x="166" y="119.2" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">H319: Causes serious eye irritation.</text><text x="166" y="130.4" font-family="Arial, sans-serif" font-size="8.8" fill="#111827">H336: May cause drowsiness or dizziness.</text><text x="166" y="174" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e40af">PRECAUTIONARY STATEMENTS:</text><text x="166" y="186" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">P210: Keep away from heat, hot surfaces, sparks, open</text><text x="166" y="197.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">flames. No smoking.</text><text x="166" y="208.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">P261: Avoid breathing vapours. P280: Wear protective</text><text x="166" y="219.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">gloves and eye protection.</text><text x="166" y="230.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">P305+P351+P338: IF IN EYES: Rinse cautiously with water</text><text x="166" y="241.0" font-family="Arial, sans-serif" font-size="8.6" fill="#1f2937">for several minutes.</text>
